<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Combos">
<title>Cuaderno · Combos del Mar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --fondo:#FAF8F4; --carta:#FFFFFF; --tinta:#1F1D1A; --gris:#6F6A62; --gris2:#A39E95; --linea:#ECE7DF; --suave:#F3EFE8;
  --naranja:#E8702A; --naranja2:#FCEBDD; --azul:#1E4FA3; --azul2:#E6EDF8; --verde:#1F9D55; --verde2:#E3F4EA; --rojo:#C8432F; --rojo2:#FBE7E3;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}

/* cabecera */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.marca{flex:1;min-width:0}
.marca b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.marca span{font-size:13px;color:var(--gris)}
.yo{display:flex;align-items:center;gap:8px;border:1px solid var(--linea);background:var(--carta);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.vivo{width:8px;height:8px;border-radius:50%;background:var(--verde);display:inline-block;margin-right:4px}
.vivo.no{background:var(--gris2)}

/* día */
.dia{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dia .flecha{width:42px;height:42px;border-radius:12px;border:1px solid var(--linea);background:var(--carta);font-size:20px;font-weight:600;flex:none}
.dia .f{flex:1;height:42px;border-radius:12px;border:1px solid var(--linea);background:var(--carta);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.dia .f small{font-size:11px;font-weight:700;color:var(--naranja);letter-spacing:.06em}

/* filtro vendedor */
.seg{display:flex;background:var(--suave);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--gris)}
.seg button.on{background:var(--carta);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* tarjetas */
.card{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--gris);font-size:14px}
.small{font-size:13px;color:var(--gris)}
.num{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:12px}
.kpi .l{font-size:12px;color:var(--gris);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--gris)}
.kpi.dest{background:var(--tinta);border-color:var(--tinta);color:#fff}.kpi.dest .l,.kpi.dest .s{color:#C9C3B8}
.fila{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-ok{background:var(--verde2);color:var(--verde)}.p-debe{background:var(--rojo2);color:var(--rojo)}.p-pend{background:var(--naranja2);color:#A94E14}.p-az{background:var(--azul2);color:var(--azul)}
.vend{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--gris)}
.vend i{width:8px;height:8px;border-radius:50%}

/* botones */
.btn{border:0;border-radius:14px;padding:13px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center;line-height:1.2}
.b-nar{background:var(--naranja);color:#fff}
.b-tin{background:var(--tinta);color:#fff}
.b-ver{background:var(--verde);color:#fff}
.b-sua{background:var(--suave);color:var(--tinta)}
.b-bor{background:var(--carta);border:1px solid var(--linea);color:var(--tinta)}
.b-rojo{background:var(--rojo2);color:var(--rojo)}
.full{width:100%}
.acts{display:flex;gap:8px;margin-top:12px}.acts>*{flex:1}
.btn:disabled{opacity:.5}

/* pedido */
.ped{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ped.hecho{opacity:.72}
.ped .cab{display:flex;align-items:flex-start;gap:10px}
.ped .hr{min-width:54px;text-align:center;background:var(--suave);border-radius:10px;padding:6px 4px;font-weight:800;font-size:14px;line-height:1.1}
.ped .hr small{display:block;font-size:10px;font-weight:600;color:var(--gris)}
.ped .q{font-weight:700;font-size:16px;line-height:1.25;word-break:break-word}
.ped .tot{font-weight:800;font-size:17px;white-space:nowrap}
.ped .det{margin-top:10px;font-size:15px}
.ped .det b{font-weight:700}
.ped .dir{margin-top:6px;font-size:14px;color:var(--gris)}
.ped .dir a{color:var(--azul);font-weight:600;text-decoration:none}
.ped .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(250,248,244,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--linea);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.nav .t{flex:1;border:0;background:none;border-radius:12px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--gris);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav .t svg{width:22px;height:22px}
.nav .t.on{color:var(--tinta)}
.nav .t.on svg{color:var(--naranja)}
.nav .mas{width:56px;height:56px;border-radius:18px;border:0;background:var(--naranja);color:#fff;font-size:30px;font-weight:500;flex:none;box-shadow:0 6px 16px rgba(232,112,42,.35);margin-top:-18px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--naranja);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}

/* hoja */
.velo{position:fixed;inset:0;background:rgba(31,29,26,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.velo.on{display:flex}
.hoja{background:var(--fondo);width:100%;max-width:560px;max-height:96dvh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:sube .22s cubic-bezier(.2,.8,.2,1)}
.hoja .asa{width:40px;height:5px;border-radius:3px;background:var(--linea);margin:4px auto 12px}
@keyframes sube{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.hoja h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
label{display:block;font-weight:600;font-size:13px;color:var(--gris);margin:16px 0 6px}
input,textarea{width:100%;border:1px solid var(--linea);background:var(--carta);border-radius:12px;padding:13px;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja2)}
.prod{display:flex;align-items:center;gap:10px;background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.prod.sel{border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja2)}
.prod .n{font-weight:700;font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;border:0;background:var(--tinta);color:#fff;font-size:22px;font-weight:600}
.step button.m{background:var(--suave);color:var(--tinta)}
.step span{min-width:22px;text-align:center;font-weight:800;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--carta);border-radius:999px;padding:9px 13px;font-weight:600;font-size:14px}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.totbox{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:12px 14px;margin-top:16px}
.totbox .r{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.totbox .r.t{border-top:1px dashed var(--linea);margin-top:6px;padding-top:9px;font-weight:800;font-size:20px}
details summary{cursor:pointer;font-weight:600;color:var(--azul);margin-top:16px;font-size:14px}
.conocido{background:var(--azul2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.cal{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:10px;margin-top:8px}
.calcab{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calcab b{font-size:15px}
.calcab button{width:36px;height:36px;border-radius:10px;border:1px solid var(--linea);background:var(--carta);font-size:18px}
.calcab button:disabled{opacity:.3}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{text-align:center;font-size:11px;font-weight:700;color:var(--gris2)}
.cdia{position:relative;aspect-ratio:1.15;border:0;border-radius:10px;background:var(--suave);font-weight:700;font-size:15px}
.cdia:disabled{background:none;color:#D3CEC5}
.cdia.hoy{box-shadow:inset 0 0 0 2px var(--naranja)}
.cdia.sel{background:var(--naranja);color:#fff;box-shadow:none}
.cdia i{position:absolute;top:-4px;right:-3px;background:var(--azul);color:#fff;font-style:normal;font-size:10px;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 3px}

/* barras */
.barra{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--suave);margin:8px 0}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--gris)}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:9px;height:9px;border-radius:3px}
.leg b{color:var(--tinta)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--gris);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--linea)}
table.t td{padding:10px 4px;border-bottom:1px solid var(--linea);font-weight:600}
table.t .r{text-align:right}
table.t tr:last-child td{border-bottom:0}
.lin{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--linea);font-size:15px}
.lin:last-child{border-bottom:0}
.vacio{text-align:center;color:var(--gris);padding:36px 16px}
.vacio b{display:block;color:var(--tinta);font-size:17px;margin-bottom:4px}
.aviso{background:var(--naranja2);color:#8A3F10;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.x{border:0;background:var(--rojo2);color:var(--rojo);border-radius:10px;width:32px;height:32px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--tinta);color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* login */
.login{max-width:380px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 20px 30px;min-height:100dvh;display:flex;flex-direction:column}
.login h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:18px 0 4px}
.quien{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.quien button{display:flex;align-items:center;gap:12px;border:1px solid var(--linea);background:var(--carta);border-radius:16px;padding:14px;font-weight:700;font-size:17px;text-align:left}
.quien .av{width:40px;height:40px;font-size:16px}
.puntos{display:flex;justify-content:center;gap:12px;margin:26px 0 22px}
.puntos i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gris2)}
.puntos i.on{background:var(--tinta);border-color:var(--tinta)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.teclado button{height:62px;border-radius:16px;border:1px solid var(--linea);background:var(--carta);font-size:24px;font-weight:600}
.teclado button.v{border:0;background:none;font-size:15px;color:var(--gris)}
.err{color:var(--rojo);text-align:center;font-weight:600;font-size:14px;min-height:20px;margin-top:-10px;margin-bottom:8px}
.sacude{animation:sac .35s}
@keyframes sac{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:6px}
.tilebtn{border:2px solid var(--linea);background:var(--carta);border-radius:16px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .08s,border-color .15s}
.tilebtn:active{transform:scale(.97)}
.tile.sel .tilebtn{border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja2)}
.tim{position:relative;display:block;aspect-ratio:16/10;background:linear-gradient(135deg,#FCEBDD,#E6EDF8)}
.tim img{width:100%;height:100%;object-fit:cover;display:block}
.tc{position:absolute;top:8px;right:8px;min-width:34px;height:34px;border-radius:999px;background:var(--naranja);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tc.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.35)}}
.tn{font-weight:700;font-size:15px;padding:8px 10px 0}
.tp{font-weight:800;font-size:17px;padding:0 10px 10px;color:var(--naranja)}
.tmenos{border:0;background:var(--suave);border-radius:10px;padding:8px;font-weight:600;font-size:13px;color:var(--gris)}
.suma{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--naranja2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;font-weight:600;color:#8A3F10}
.suma b{font-size:18px;color:var(--tinta)}
.tlb{position:absolute;left:8px;bottom:8px;background:rgba(31,29,26,.75);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:3px 6px}
.tp small{font-size:12px;color:var(--gris);font-weight:600}
.medias{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.otros{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--azul2);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.otros .chip{padding:6px 11px;font-size:13px;border-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<div class="velo" id="velo"><div class="hoja" id="hoja"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
/* ============ configuración ============ */
const SB_URL="https://ezvmkihqgdbcyjydvudr.supabase.co";
const SB_KEY="sb_publishable_4xQ7D_GPmGSi3_Ac7lmCcQ_nOjiGNfv";
const PERFILES=[
  {nombre:"Luis Enrique", email:"luisenrique@combosdelmar.app", color:"#E8702A"},
  {nombre:"Iván", email:"ivan@combosdelmar.app", color:"#1E4FA3"}
];
const WA_NEGOCIO="3152109656";
const GRAMOS={"mar-personal":{sal:1,cam:250},"mar-doble":{sal:2,cam:500}};

const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

/* ============ estado ============ */
const S={yo:null,perfiles:[],productos:[],pedidos:[],gastos:[],compras:[],config:{gracias:"",domicilio:3000},
  tab:"entregas",dia:null,quien:"todos",vivo:false,cargado:false};

/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoy=()=>iso(new Date());
const masDias=(f,n)=>{const[y,m,d]=f.split("-").map(Number);return iso(new Date(y,m-1,d+n));};
const proxSabado=()=>{const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7));return iso(d);};
const plata=n=>"$"+Math.round(n||0).toLocaleString("es-CO");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dig=s=>String(s||"").replace(/\D/g,"");
const celB=c=>{c=dig(c);return c.length===10?c.slice(0,3)+" "+c.slice(3,6)+" "+c.slice(6):c;};
const wa=(cel,t)=>{let c=dig(cel);if(c.length===10)c="57"+c;return"https://wa.me/"+c+(t?"?text="+encodeURIComponent(t):"");};
const mapa=d=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(d+", Barrancabermeja, Santander");
const hm=ts=>new Date(ts).toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
const h12=h=>{if(!h)return"";const[a,b]=h.split(":").map(Number);const d=new Date();d.setHours(a,b,0,0);return hm(d);};
const nomDia=f=>{const[y,m,d]=f.split("-").map(Number);const t=new Date(y,m-1,d).toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});return t.charAt(0).toUpperCase()+t.slice(1);};
const corto=f=>{const[y,m,d]=f.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");};
const esLb=i=>i.unidad==="lb"||/-lb$/.test(i.id||"");
const fmtLb=n=>(+n).toLocaleString("es-CO",{maximumFractionDigits:2})+" lb";
const cantTxt=i=>esLb(i)?fmtLb(i.cant):i.cant+"×";
const cuantos=p=>(p.items||[]).filter(i=>!esLb(i)).reduce((s,i)=>s+(+i.cant||0),0);
const resumen=p=>(p.items||[]).filter(i=>i.cant>0).map(i=>esLb(i)?fmtLb(i.cant)+" de "+i.nombre:i.cant+"× "+i.nombre.replace(/^Combo /,"")).join(" · ");
const primer=p=>(p.nombre||"").trim().split(" ")[0];
const iniciales=n=>(n||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const perfil=id=>S.perfiles.find(p=>p.user_id===id)||{nombre:"—",color:"#A39E95"};
const prods=()=>S.productos.filter(p=>p.activo).sort((a,b)=>a.orden-b.orden);
const activos=()=>S.pedidos.filter(p=>p.estado!=="cancelado");
const filtrar=l=>S.quien==="todos"?l:l.filter(p=>p.vendedor===S.quien);
const delDia=f=>filtrar(activos().filter(p=>p.fecha===f));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600);}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast("Copiado");}catch(e){toast("No se pudo copiar");}}
const ICON={

async function tecla(n){
  if(n==="b"){PIN=PIN.slice(0,-1);}else if(PIN.length<6){PIN+=n;}
  document.querySelectorAll("#puntos i").forEach((x,i)=>x.classList.toggle("on",i<PIN.length));
  if(PIN.length===6){
    $("#err").textContent="Entrando…";
    const {data,error}=await sb.auth.signInWithPassword({email:ELEGIDO.email,password:PIN});
    if(error){ PIN=""; $("#err").textContent="Clave incorrecta"; const pu=$("#puntos"); pu.classList.add("sacude"); setTimeout(()=>{pu.classList.remove("sacude");document.querySelectorAll("#puntos i").forEach(x=>x.classList.remove("on"));},400); return; }

async function entrar(user){
  $("#root").innerHTML='<div class="vacio" style="padding-top:40vh">Cargando…</div>';
  try{ await cargarTodo(); }catch(e){ console.error(e); $("#root").innerHTML='<div class="login"><h1>No se pudo cargar</h1><div class="muted">Revise el internet e intente de nuevo.</div><button class="btn b-nar full" style="margin-top:20px" onclick="location.reload()">Reintentar</button><button class="btn b-sua full" style="margin-top:10px" id="salir0">Salir</button></div>'; $("#salir0").onclick=()=>sb.auth.signOut(); return; }
  S.yo=S.perfiles.find(p=>p.user_id===user.id);
  if(!S.yo){ await sb.auth.signOut(); ELEGIDO=null; pantallaLogin(); return; }
  if(!S.dia){ S.dia = activos().some(p=>p.fecha===hoy()&&p.estado!=="entregado") ? hoy() : (activos().filter(p=>p.fecha>hoy()&&p.estado!=="entregado").map(p=>p.fecha).sort()[0]||hoy()); }
  montar(); escuchar();
}
async function cargarTodo(){
  const desde=masDias(hoy(),-120);
  const r=await Promise.all([
    sb.from("combos_perfiles").select("*"),
    sb.from("combos_productos").select("*"),
    sb.from("combos_pedidos").select("*").gte("fecha",desde).order("creado"),
    sb.from("combos_gastos").select("*").gte("fecha",desde),
    sb.from("combos_compras").select("*").gte("fecha",desde),
    sb.from("combos_config").select("*").eq("id",1).maybeSingle()]);
  const e=r.find(x=>x.error); if(e) throw e.error;
  [S.perfiles,S.productos,S.pedidos,S.gastos,S.compras]=r.slice(0,5).map(x=>x.data||[]);
  S.config=r[5].data||S.config; S.cargado=true;
}
let canal=null;
function escuchar(){
  if(canal) sb.removeChannel(canal);
  const tablas={combos_pedidos:"pedidos",combos_gastos:"gastos",combos_compras:"compras",combos_productos:"productos",combos_config:"config"};
  canal=sb.channel("cuaderno");
  Object.keys(tablas).forEach(t=>canal.on("postgres_changes",{event:"*",schema:"public",table:t},ev=>{
    const k=tablas[t];
    if(k==="config"){ if(ev.new) S.config=ev.new; render(); return; }
    const clave=k==="compras"?(x=>x.fecha+"|"+x.producto):(x=>x.id);
    if(ev.eventType==="DELETE"){ S[k]=S[k].filter(x=>clave(x)!==clave(ev.old)); }
    else{ const i=S[k].findIndex(x=>clave(x)===clave(ev.new)); if(i>=0) S[k][i]=ev.new; else S[k].push(ev.new);
      if(k==="pedidos"&&ev.eventType==="INSERT"&&ev.new.vendedor!==S.yo.user_id) toast(perfil(ev.new.vendedor).nombre.split(" ")[0]+" anotó un pedido · "+plata(ev.new.total)); }
    render();
  }));
  canal.subscribe(st=>{ S.vivo=st==="SUBSCRIBED"; pintarVivo(); });
  document.addEventListener("visibilitychange",async()=>{ if(!document.hidden){ try{ await cargarTodo(); render(); }catch(e){} } });
}

/* ============ escritura ============ */
async function guardarPedido(p){
  const {error}=await sb.from("combos_pedidos").upsert(p);
  if(error){ toast("No se guardó. Revise el internet."); throw error; }
  const i=S.pedidos.findIndex(x=>x.id===p.id); if(i>=0) S.pedidos[i]={...S.pedidos[i],...p}; else S.pedidos.push(p); render();
}
async function cambiarPedido(id,campos){
  const {error}=await sb.from("combos_pedidos").update({...campos,editado_por:S.yo.user_id}).eq("id",id);
  if(error){ toast("No se guardó. Revise el internet."); throw error; }
  const p=S.pedidos.find(x=>x.id===id); if(p) Object.assign(p,campos); render();
}

    if(t.dataset.pago!=null){leer();B.pagado=!!t.dataset.pago;B.medio=t.dataset.pago;return re();}
    const f=t.closest("[data-f]"); if(f) switch(f.dataset.f){
      case "cerrar": leer(); if(conDatos()&&!S.pedidos.find(x=>x.id===B.id)){ const copia=JSON.parse(JSON.stringify(B)); hoja('<h2>¿Descartar este pedido?</h2><div class="muted">Se pierde lo que escribió.</div><div class="acts"><button class="btn b-nar" data-h="volver">Seguir escribiendo</button><button class="btn b-rojo" data-h="descartar">Descartar</button></div>'); hoja.copia=copia; return; } borrarBorrador(); return cerrar();
      case "guardar": return guardarForm(false);
      case "otro": return guardarForm(true);
      case "vercal": leer(); B.verCal=!B.verCal; return re();
      case "usar": {leer();const k=conocido();if(k){B.nombre=B.nombre||k.nombre;if(k.dir){B.dir=B.dir||k.dir;}}return re();}
      case "borrar": {const id=B.id;hoja('<h2>¿Borrar este pedido?</h2><div class="muted">No se puede deshacer.</div><div class="acts"><button class="btn b-sua" data-h="cerrar">No</button><button class="btn b-rojo" data-h="siborrar" data-id="'+id+'">Sí, borrar</button></div>');return;}
    }
    return;
  }
  const h=t.closest("[data-h]"); if(!h) return; const id=h.dataset.id, p=S.pedidos.find(x=>x.id===id);
  switch(h.dataset.h){
    case "cerrar": cerrar(); break;
    case "volver": B=hoja.copia; pintarForm(); break;
    case "descartar": borrarBorrador(); cerrar(); break;
    case "siborrar": { cerrar(); const {error}=await sb.from("combos_pedidos").update({estado:"cancelado",editado_por:S.yo.user_id}).eq("id",id); if(error) toast("No se pudo borrar"); else { p.estado="cancelado"; render(); toast("Pedido borrado"); } break; }
    case "medio": { const c={}; if(h.dataset.m){c.pagado=true;c.medio=h.dataset.m;c.cuando_paga="";} if(h.dataset.e==="1"){c.estado="entregado";c.entregado_en=new Date().toISOString();}
      try{ await cambiarPedido(id,c); }catch(_){ return; } if(h.dataset.e==="1") trasEntregar(p); else { cerrar(); toast("Pago anotado"); } break; }
    case "gracias": cerrar(); setTimeout(()=>cambiarPedido(id,{gracias_en:new Date().toISOString()}).catch(()=>{}),400); break;
    case "avisado": setTimeout(async()=>{ try{ await cambiarPedido(id,{avisado_en:new Date().toISOString()}); }catch(_){} siguienteAviso(); },500); break;
    case "saltar": try{ await cambiarPedido(id,{avisado_en:new Date().toISOString()}); }catch(_){} siguienteAviso(); break;
    case "dia": S.dia=h.dataset.f; cerrar(); render(); break;
    case "ggasto": { const d=$("#g-d").value.trim(), v=+dig($("#g-v").value); if(!d||!v) return toast("Falta qué y cuánto");
      const g={fecha:S.dia,vendedor:S.yo.user_id,descripcion:d,valor:v}; const {data,error}=await sb.from("combos_gastos").insert(g).select().single(); if(error) return toast("No se guardó");
      if(!S.gastos.find(x=>x.id===data.id)) S.gastos.push(data); cerrar(); render(); toast("Gasto guardado"); break; }
    case "gclave": { const a=dig($("#c-1").value), b=dig($("#c-2").value); if(a.length!==6) return toast("Deben ser 6 números"); if(a!==b) return toast("No coinciden");
      const {error}=await sb.auth.updateUser({password:a}); if(error) return toast("No se pudo cambiar"); cerrar(); toast("Clave cambiada"); break; }
  }
});
$("#velo").addEventListener("click",e=>{ if(e.target.id!=="velo") return; if(B){ leer(); guardarBorrador(); return; } cerrar(); });
$("#hoja").addEventListener("input",e=>{
  if(!B) return;
  clearTimeout(guardarBorrador.t); guardarBorrador.t=setTimeout(()=>{ if(B){ leer(); guardarBorrador(); } },400);
  if(e.target.id==="f-val"){ leer(); const x=$("#f-tot"); if(x) x.textContent=plata(totB()); }
  if(e.target.id==="f-cel"){ const antes=!!conocido(); B.cel=e.target.value; if(antes!==!!conocido()&&!S.pedidos.find(x=>x.id===B.id)){ leer(); const sy=$("#hoja").scrollTop; pintarForm(); $("#hoja").scrollTop=sy; const i=$("#f-cel"); i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }
  if(e.target.id==="f-hora"){ B.hora=e.target.value; document.querySelectorAll("[data-hora]").forEach(c=>c.classList.toggle("on",c.dataset.hora===B.hora)); }
});

/* ============ acciones de pantalla ============ */
function preguntarPago(p,entregando){
  hoja('<h2>'+(entregando?"¿Ya le pagó?":"¿Cómo pagó?")+'</h2><div class="muted">'+esc(p.nombre||celB(p.cel))+' · '+esc(resumen(p))+'</div><div class="totbox"><div class="r t" style="border:0;margin:0;padding:0"><span>Total</span><span>'+plata(p.total)+'</span></div></div>'+
   '<div class="acts"><button class="btn b-tin" data-h="medio" data-m="Efectivo" data-id="'+p.id+'" data-e="'+(entregando?1:0)+'">Efectivo</button><button class="btn b-tin" data-h="medio" data-m="Nequi" data-id="'+p.id+'" data-e="'+(entregando?1:0)+'">Nequi</button></div>'+
   (entregando?'<button class="btn b-bor full" style="margin-top:8px" data-h="medio" data-m="" data-id="'+p.id+'" data-e="1">Todavía no pagó</button>':'')+'<button class="btn b-sua full" style="margin-top:8px" data-h="cerrar">Cancelar</button>');
}
function trasEntregar(p){
  hoja('<h2>¡Entregado! ✓</h2><div class="muted">¿Le manda las gracias a '+esc(p.nombre||celB(p.cel))+'?</div><div style="background:var(--suave);border-radius:12px;padding:12px;margin:12px 0;font-size:15px">'+esc(msgGracias(p))+'</div>'+
   '<a class="btn b-nar full" target="_blank" rel="noopener" href="'+wa(p.cel,msgGracias(p))+'" data-h="gracias" data-id="'+p.id+'">Enviar gracias por WhatsApp</a><button class="btn b-sua full" style="margin-top:8px" data-h="cerrar">Ahora no</button>');
}
function siguienteAviso(){
  const l=delDia(S.dia).filter(p=>p.estado!=="entregado"&&!p.avisado_en).sort((a,b)=>(a.hora||"99").localeCompare(b.hora||"99"));
  if(!l.length) return hoja('<h2>Todos avisados ✓</h2><div class="muted">Ya les avisó a todos los clientes de este día.</div><button class="btn b-nar full" style="margin-top:14px" data-h="cerrar">Listo</button>');
  const p=l[0], m="Hola"+(primer(p)?" "+primer(p):"")+"! 🛵 Ya vamos para allá con su pedido: "+resumen(p)+"."+(p.pagado?" Ya está pagado.":" Total "+plata(p.total)+".")+" ¡Gracias por comprar Combos del Mar!";
  hoja('<h2>Avisar “ya vamos”</h2><div class="muted">Faltan '+l.length+'. Toque Enviar en WhatsApp, vuelva aquí y siga con el próximo.</div><div style="background:var(--suave);border-radius:12px;padding:12px;margin:12px 0"><b>'+esc(p.nombre||celB(p.cel))+'</b><div class="small">'+esc(p.dir)+'</div><div style="margin-top:6px;font-size:15px">'+esc(m)+'</div></div>'+
   '<a class="btn b-nar full" target="_blank" rel="noopener" href="'+wa(p.cel,m)+'" data-h="avisado" data-id="'+p.id+'">Enviar a '+esc(primer(p)||celB(p.cel))+'</a><div class="acts"><button class="btn b-bor" data-h="saltar" data-id="'+p.id+'">Saltar</button><button class="btn b-sua" data-h="cerrar">Terminar</button></div>');
}
function hojaDia(){
  const fechas=[...new Set(activos().filter(p=>p.fecha>=masDias(hoy(),-7)).map(p=>p.fecha).concat([hoy(),masDias(hoy(),1),proxSabado()]))].sort();
  hoja('<h2>Ir al día</h2>'+fechas.map(f=>{const n=activos().filter(p=>p.fecha===f).length;return '<button class="btn b-bor full" style="justify-content:space-between;margin-top:8px'+(f===S.dia?';border-color:var(--naranja)':'')+'" data-h="dia" data-f="'+f+'"><span>'+esc(nomDia(f))+(f===hoy()?" · hoy":"")+'</span><span class="small">'+(n?n+" pedidos":"")+'</span></button>';}).join(""));
}
function csv(lista){
  const f=a=>a.map(x=>{x=String(x==null?"":x);return /[";\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(";");
  const r=[f(["Fecha","Vendió","Cliente","Celular","Dirección","Hora","Pedido","Combos","Domicilio","Total","Pagado","Medio","Estado","Entregado"])];
  lista.forEach(p=>r.push(f([p.fecha,perfil(p.vendedor).nombre,p.nombre,p.cel,p.dir,p.hora,resumen(p),cuantos(p),p.domicilio,p.total,p.pagado?"Sí":"No",p.medio,p.estado,p.entregado_en?hm(p.entregado_en):""])));
  return "﻿"+r.join("\r\n");
}
function excel(todo){
  const l=(todo?filtrar(activos()):delDia(S.dia)).slice().sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  if(!l.length) return toast("No hay pedidos");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv(l)],{type:"text/csv;charset=utf-8"})); a.download=todo?"combos-todo.csv":"combos-"+S.dia+".csv"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function ruta(){
  const l=delDia(S.dia).filter(p=>p.estado!=="entregado").sort((a,b)=>(a.hora||"99").localeCompare(b.hora||"99"));
  return "🛵 RUTA "+nomDia(S.dia).toUpperCase()+"\n\n"+l.map((p,i)=>(i+1)+". "+(p.hora?h12(p.hora):"Sin hora")+" · "+(p.nombre||celB(p.cel))+"\n   "+resumen(p)+"\n   📍 "+(p.dir||"Recoge")+"\n   📲 "+celB(p.cel)+" · "+(p.pagado?"Ya pagó":"Cobrar "+plata(p.total))).join("\n\n");
}
async function clicMain(e){
  const ir=e.target.closest("[data-irdia]"); if(ir){S.dia=ir.dataset.irdia;render();window.scrollTo(0,0);return;}
  const tr=e.target.closest("[data-dia]"); if(tr){S.dia=tr.dataset.dia;S.tab="entregas";render();window.scrollTo(0,0);return;}
  const a=e.target.closest("[data-a]"); if(!a) return; const id=a.dataset.id, p=S.pedidos.find(x=>x.id===id);
  switch(a.dataset.a){
    case "nuevo": abrirPedido(); break;
    case "editar": abrirPedido(p); break;
    case "entregar": if(p.pagado){ try{ await cambiarPedido(id,{estado:"entregado",entregado_en:new Date().toISOString()}); trasEntregar(p);}catch(_){} } else preguntarPago(p,true); break;
    case "pagar": preguntarPago(p,false); break;
    case "deshacer": try{ await cambiarPedido(id,{estado:"pendiente",entregado_en:null}); toast("Volvió a por entregar"); }catch(_){} break;
    case "gracias": setTimeout(()=>cambiarPedido(id,{gracias_en:new Date().toISOString()}).catch(()=>{}),400); break;
    case "avisar": siguienteAviso(); break;
    case "copiarlista": copiar(ruta()); break;
    case "excel": excel(a.dataset.r==="todo"); break;
    case "gasto": hoja('<h2>Agregar gasto</h2><div class="small">Queda a nombre de '+esc(S.yo.nombre)+' · '+esc(corto(S.dia))+'</div><label>¿En qué?</label><input id="g-d" placeholder="Gasolina, bolsas, hielo…"><label>¿Cuánto?</label><input id="g-v" inputmode="numeric" placeholder="$0"><div class="acts"><button class="btn b-sua" data-h="cerrar">Cancelar</button><button class="btn b-nar" data-h="ggasto">Guardar</button></div>'); break;
    case "borrargasto": { const {error}=await sb.from("combos_gastos").delete().eq("id",id); if(error) return toast("No se pudo borrar"); S.gastos=S.gastos.filter(g=>g.id!==id); render(); break; }
    case "copiarpromo": copiar(mensajeVenta()); break;
    case "clave": hoja('<h2>Cambiar clave</h2><label>Nueva clave (6 números)</label><input id="c-1" type="password" inputmode="numeric" maxlength="6"><label>Repítala</label><input id="c-2" type="password" inputmode="numeric" maxlength="6"><div class="acts"><button class="btn b-sua" data-h="cerrar">Cancelar</button><button class="btn b-nar" data-h="gclave">Guardar</button></div>'); break;
    case "salir": if(canal) sb.removeChannel(canal); await sb.auth.signOut(); ELEGIDO=null; pantallaLogin(); break;
  }
}
async function cambioMain(e){
  const t=e.target;
  if(t.dataset.compra){ const c=S.compras.find(x=>x.fecha===S.dia&&x.producto===t.dataset.compra)||{fecha:S.dia,producto:t.dataset.compra,cant:0,costo:0};
    const n={...c,[t.dataset.k]:+dig(t.value)||0}; const {error}=await sb.from("combos_compras").upsert(n); if(error) return toast("No se guardó");
    const i=S.compras.findIndex(x=>x.fecha===n.fecha&&x.producto===n.producto); if(i>=0)S.compras[i]=n; else S.compras.push(n); render(); toast("Guardado"); }
  if(t.dataset.precio){ const v=+dig(t.value), p=S.productos.find(x=>x.id===t.dataset.precio); if(!v||v===p.precio) return render();
    const {error}=await sb.from("combos_productos").update({precio:v}).eq("id",p.id); if(error) return toast("No se guardó"); p.precio=v; render(); toast("Precio cambiado"); }
  if(t.dataset.dom){ const v=+dig(t.value); if(v===S.config.domicilio) return; const {error}=await sb.from("combos_config").update({domicilio:v}).eq("id",1); if(error) return toast("No se guardó"); S.config.domicilio=v; render(); toast("Domicilio cambiado"); }
  if(t.id==="gracias"){ const v=t.value.trim(); if(!v||v===S.config.gracias) return; const {error}=await sb.from("combos_config").update({gracias:v}).eq("id",1); if(error) return toast("No se guardó"); S.config.gracias=v; render(); toast("Mensaje guardado"); }
}

document.addEventListener("visibilitychange",()=>{ if(document.hidden&&B){ leer(); guardarBorrador(); } });
window.addEventListener("pagehide",()=>{ if(B){ leer(); guardarBorrador(); } });
inicio();
})();
</script>
